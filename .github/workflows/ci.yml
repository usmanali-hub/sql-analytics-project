name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pytest mypy ruff duckdb
      - run: ruff check .
      - run: mypy
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python -m sqlproject check
      - run: PYTHONPATH=src python -m sqlproject report
      - name: Results and docs are committed and current
        run: git diff --exit-code
